<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" role="img" aria-labelledby="title desc">
  <title id="title">150日元自动售货机状态图</title>
  <desc id="desc">展示累计零、五十、一百日元三个状态，以及投入五十或一百日元时的转移、出货和找零。</desc>
  <style>
    :root { --bg:#ffffff; --fg:#172033; --muted:#5c667a; --line:#475569; --grid:#cbd3df; --soft:#f5f7fb; --blue:#2563eb; --orange:#d97706; --green:#16845b; --red:#c2414b; }
    @media (prefers-color-scheme: dark) { :root { --bg:#111827; --fg:#eef2ff; --muted:#b8c0d4; --line:#d6deee; --grid:#465064; --soft:#1b2434; --blue:#7ba7ff; --orange:#ffbb62; --green:#58d3a5; --red:#ff8992; } }
    text { font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif; fill:var(--fg); }
    .bg { fill:var(--bg); }
    .state { fill:var(--soft); stroke:var(--grid); stroke-width:3; }
    .arrow { fill:none; stroke:var(--line); stroke-width:3; marker-end:url(#arrow); }
    .vend { stroke:var(--green); }
    .change { stroke:var(--orange); }
    .title { font-size:24px; font-weight:500; }
    .state-name { font-size:24px; font-weight:500; text-anchor:middle; }
    .state-code { font-size:17px; fill:var(--muted); text-anchor:middle; }
    .label { font-size:17px; fill:var(--fg); text-anchor:middle; }
    .legend { font-size:17px; fill:var(--muted); }
    text { fill:#172033; }
    .bg { fill:#ffffff; }
    .state { fill:#f5f7fb; stroke:#cbd3df; }
    .arrow { stroke:#475569; }
    .vend { stroke:#16845b; }
    .change { stroke:#d97706; }
    .state-code,.legend { fill:#5c667a; }
    .change-label { fill:#d97706; }
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker></defs>
  <rect class="bg" width="1100" height="680"/>
  <text x="45" y="48" class="title">150日元饮料机：边标签 = 输入 / 输出</text>
  <text x="45" y="80" class="legend">输入：01=50日元，10=100日元　　输出：00=不出货，01=出货，10=出货并找零50日元</text>

  <circle cx="210" cy="350" r="92" class="state"/>
  <circle cx="610" cy="195" r="92" class="state"/>
  <circle cx="820" cy="480" r="92" class="state"/>
  <text x="210" y="345" class="state-name">S₀</text><text x="210" y="378" class="state-code">累计0日元 · 00</text>
  <text x="610" y="190" class="state-name">S₅₀</text><text x="610" y="223" class="state-code">累计50日元 · 10</text>
  <text x="820" y="475" class="state-name">S₁₀₀</text><text x="820" y="508" class="state-code">累计100日元 · 11</text>

  <path d="M285 295 C390 205 465 185 510 190" class="arrow"/>
  <text x="400" y="205" class="label">01 / 00</text>
  <path d="M298 385 C460 465 600 490 718 482" class="arrow"/>
  <text x="500" y="470" class="label">10 / 00</text>
  <path d="M674 267 C716 320 752 370 784 401" class="arrow"/>
  <text x="760" y="330" class="label">01 / 00</text>

  <path d="M540 255 C450 315 355 335 305 340" class="arrow vend"/>
  <text x="425" y="314" class="label">10 / 01　出货</text>
  <path d="M739 530 C555 620 350 545 278 423" class="arrow vend"/>
  <path d="M755 545 C570 645 355 585 290 430" class="arrow change"/>
  <text x="500" y="578" class="label">01 / 01　出货</text>
  <text x="545" y="615" class="label change-label">10 / 10　出货 + 找零</text>

  <path d="M155 265 C92 190 102 115 185 112 C270 108 290 180 250 260" class="arrow"/>
  <path d="M675 130 C760 80 815 210 695 235" class="arrow"/>
  <path d="M895 535 C980 560 965 650 850 572" class="arrow"/>
  <text x="125" y="150" class="label">00 / 00</text><text x="775" y="125" class="label">00 / 00</text><text x="965" y="610" class="label">00 / 00</text>

  <text x="550" y="655" class="legend" text-anchor="middle">达到150日元后回到 S₀；超过150日元时输出找零编码</text>
</svg>
